<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Trip Planner | Smart Digital Tourism</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7f9;
            color: #19344f;
        }

        header {
            height: 78px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6%;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #17456c;
            font-size: 23px;
            font-weight: bold;
            text-decoration: none;
        }
        .back-link {
            text-decoration: none;
            background: #e2eaf0;
            color: #17456c;
            padding: 10px 18px;
            border-radius: 7px;
            font-weight: bold;
            transition: 0.2s;
        }
        .back-link:hover { background: #d0dde7; }

        .container {
            width: 85%;
            max-width: 900px;
            margin: 40px auto;
        }

        .planner-card {
            background: white;
            border-radius: 12px;
            padding: 35px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border-left: 6px solid #1267b1;
        }
        .planner-card h2 {
            margin-top: 0;
            color: #173b59;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .planner-card p {
            color: #667788;
            line-height: 1.6;
        }

        .planner-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin: 25px 0;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            font-weight: bold;
            color: #173b59;
            margin-bottom: 8px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccd6df;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #1267b1;
            box-shadow: 0 0 0 2px rgba(18,103,177,0.15);
        }

        .primary-btn {
            border: none;
            background: #1267b1;
            color: white;
            padding: 14px 28px;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .primary-btn:hover { background: #084e89; }

        .secondary-btn {
            border: none;
            background: #777;
            color: white;
            padding: 14px 25px;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-left: 10px;
        }
        .secondary-btn:hover { background: #555; }

        .plan-result {
            display: none;
            margin-top: 30px;
            padding: 25px;
            border-radius: 10px;
            background: #f5f9fc;
            border: 1px solid #d8e5ef;
        }
        .trip-summary {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin: 20px 0;
        }
        .summary-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #dce5ec;
        }
        .summary-card strong {
            display: block;
            color: #1267b1;
            font-size: 18px;
            margin-top: 5px;
        }
        .day-card {
            background: white;
            margin: 15px 0;
            padding: 20px;
            border-radius: 9px;
            border-left: 5px solid #1267b1;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .ai-success {
            background: #eaf7ee;
            color: #28733b;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        @media(max-width: 600px) {
            .planner-grid, .trip-summary { grid-template-columns: 1fr; }
            .secondary-btn { margin-left: 0; margin-top: 10px; }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">
            <span>🌍</span>
            <span>Smart Digital Tourism</span>
        </a>
        <a href="index.html" class="back-link">&larr; Back to Home</a>
    </header>

    <div class="container">
        <section class="planner-card">
            <h2>🤖 AI Trip Planner</h2>
            <p>Create a personalized Maharashtra tourism plan based on destination, dates, budget, and travel preferences.</p>

            <div class="planner-grid">
                <div class="form-group">
                    <label>📍 Destination</label>
                    <select id="planDestination">
                        <option value="">Select Destination</option>
                        <option value="Ajanta Caves">Ajanta Caves</option>
                        <option value="Ellora Caves">Ellora Caves</option>
                        <option value="Tadoba Tiger Reserve">Tadoba Tiger Reserve</option>
                        <option value="Mahabaleshwar">Mahabaleshwar</option>
                        <option value="Lonavala">Lonavala</option>
                        <option value="Mumbai">Mumbai</option>
                        <option value="Pune">Pune</option>
                        <option value="Nashik">Nashik</option>
                        <option value="Chhatrapati Sambhajinagar">Chhatrapati Sambhajinagar</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>📅 Travel Date</label>
                    <input type="date" id="planDate">
                </div>

                <div class="form-group">
                    <label>🎯 Interest</label>
                    <select id="planInterest">
                        <option value="Historical Tourism">Historical Tourism</option>
                        <option value="Wildlife">Wildlife</option>
                        <option value="Eco Tourism">Eco Tourism</option>
                        <option value="Adventure">Adventure</option>
                        <option value="Culture & Food">Culture & Food</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>📆 Number of Days</label>
                    <select id="planDays">
                        <option value="1">1 Day</option>
                        <option value="2">2 Days</option>
                        <option value="3">3 Days</option>
                        <option value="4">4 Days</option>
                        <option value="5">5 Days</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>💰 Budget</label>
                    <select id="planBudget">
                        <option value="Budget ₹1,000 – ₹3,000">Budget ₹1,000 – ₹3,000</option>
                        <option value="Standard ₹3,000 – ₹7,000">Standard ₹3,000 – ₹7,000</option>
                        <option value="Premium ₹7,000+">Premium ₹7,000+</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>👥 Number of Tourists</label>
                    <input type="number" id="planPeople" value="2" min="1" max="20">
                </div>
            </div>

            <button class="primary-btn" onclick="generatePlan()">🤖 Generate AI Trip Plan</button>
            <button class="secondary-btn" onclick="clearPlan()">Clear</button>

            <div id="planResult" class="plan-result"></div>
        </section>
    </div>

    <script>
        function generatePlan() {
            const destination = document.getElementById("planDestination").value;
            const date = document.getElementById("planDate").value;
            const interest = document.getElementById("planInterest").value;
            const days = parseInt(document.getElementById("planDays").value, 10);
            const budget = document.getElementById("planBudget").value;
            const people = parseInt(document.getElementById("planPeople").value, 10);

            if (!destination) { alert("Please select a destination."); return; }
            if (!date) { alert("Please select your travel date."); return; }

            const places = {
                "Ajanta Caves": ["Ajanta Caves Viewpoint", "Caves Complex (1-29)", "Buddhist Heritage Area", "Local Cuisine Stall"],
                "Ellora Caves": ["Kailasa Temple (Cave 16)", "Buddhist Caves", "Daulatabad Fort", "Bibi Ka Maqbara"],
                "Tadoba Tiger Reserve": ["Morning Core Safari", "Moharli Zone", "Tadoba Lake Trail", "Buffer Safari"],
                "Mahabaleshwar": ["Venna Lake", "Arthur's Seat", "Mapro Garden", "Elephant's Head Point"],
                "Lonavala": ["Tiger Point", "Bhushi Dam", "Karla Caves", "Lonavala Bazaar"],
                "Mumbai": ["Gateway of India", "Elephanta Caves", "Marine Drive", "CSMT Heritage Walk"],
                "Pune": ["Shaniwar Wada", "Aga Khan Palace", "Sinhagad Fort", "Pataleshwar Cave"],
                "Nashik": ["Trimbakeshwar Temple", "Sula Vineyards", "Pandavleni Caves", "Godavari Ghats"],
                "Chhatrapati Sambhajinagar": ["Bibi Ka Maqbara", "Ellora Caves", "Daulatabad Fort", "Panchakki"]
            };

            const attractions = places[destination] || [destination, "Heritage Spot", "Nature Trail", "Local Market"];

            let result = `
                <div class="ai-success">✓ AI Trip Plan Generated Successfully</div>
                <h2>🤖 Your Personalized Trip Plan</h2>
                <div class="trip-summary">
                    <div class="summary-card">📍<strong>${destination}</strong>Destination</div>
                    <div class="summary-card">📅<strong>${date}</strong>Date</div>
                    <div class="summary-card">📆<strong>${days} Days</strong>Duration</div>
                    <div class="summary-card">👥<strong>${people}</strong>Tourists</div>
                </div>
                <p><strong>🎯 Focus:</strong> ${interest} | <strong>💰 Tier:</strong> ${budget}</p>
            `;

            for (let i = 1; i <= days; i++) {
                const morning = attractions[(i - 1) % attractions.length];
                const afternoon = attractions[i % attractions.length];
                result += `
                    <div class="day-card">
                        <h3>📅 Day ${i}</h3>
                        <p>🌅 <strong>Morning:</strong> Visit ${morning}</p>
                        <p>☀️ <strong>Afternoon/Evening:</strong> Explore ${afternoon}</p>
                        <p>🍽️ <strong>Food:</strong> Try regional Maharashtrian specialties.</p>
                    </div>
                `;
            }

            const resultBox = document.getElementById("planResult");
            resultBox.innerHTML = result;
            resultBox.style.display = "block";
            resultBox.scrollIntoView({ behavior: "smooth" });
        }

        function clearPlan() {
            document.getElementById("planDestination").value = "";
            document.getElementById("planDate").value = "";
            document.getElementById("planResult").style.display = "none";
        }
    </script>
</body>
</html>
